name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Recreate Clean Windows Platform
        # هذا الأمر يقوم بتوليد ملفات نظام ويندوز C++ النظيفة التي يحتاجها البناء
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          if (Test-Path test) { Remove-Item -Recurse -Force test }
          flutter create . --project-name alaa_accounts --platforms=windows --org com.elsayed.accounts

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Elsayed-Accounts-Windows-EXE
          path: build\windows\*\runner\Release\*
