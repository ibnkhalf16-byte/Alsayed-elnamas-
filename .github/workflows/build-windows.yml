name: Build Windows Desktop

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:

    runs-on: windows-2022

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ==========================================
      # 2. إعداد Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # 3. تفعيل Windows
      # ==========================================
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop


      # ==========================================
      # 4. إنشاء ملفات Windows
      #    لأن المشروع لا يحتوي على مجلد windows
      # ==========================================
      - name: Create Windows Project
        run: flutter create --platforms=windows .


      # ==========================================
      # 5. التحقق من البيئة
      # ==========================================
      - name: Flutter Doctor
        run: flutter doctor -v


      # ==========================================
      # 6. تنظيف المشروع
      # ==========================================
      - name: Flutter Clean
        run: flutter clean


      # ==========================================
      # 7. تحميل الحزم
      # ==========================================
      - name: Flutter Pub Get
        run: flutter pub get


      # ==========================================
      # 8. بناء Windows Release
      # ==========================================
      - name: Build Windows Release
        run: flutter build windows --release


      # ==========================================
      # 9. ضغط البرنامج
      # ==========================================
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "alsayed_app.zip"


      # ==========================================
      # 10. رفع البرنامج
      # ==========================================
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: alsayed-Windows
          path:  AbuShadyTransport-Windows.zip


