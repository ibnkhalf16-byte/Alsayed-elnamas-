name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Platform
        run: |
          flutter config --no-analytics
          rm -rf android/
          flutter create . --project-name alaa_accounts --platforms=android --org com.elsayed.accounts

      - name: Rename App to "حسابات السيد النماس"
        run: sed -i 's/android:label="alaa_accounts"/android:label="حسابات السيد النماس"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alsayed-Elnamas-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
