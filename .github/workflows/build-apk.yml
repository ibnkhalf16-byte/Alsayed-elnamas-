name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Platform
        run: |
          flutter config --no-analytics
          rm -rf android/
          rm -rf test/
          flutter create . --project-name elsayed_accounts --platforms=android --org com.elsayed.accounts

      - name: Force Android compileSdk 34 for App & Plugins
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          echo -e "\nsubprojects {\n    project.plugins.withId(\"com.android.library\") {\n        project.android {\n            compileSdkVersion 34\n        }\n    }\n}" >> android/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elsayed-Accounts-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
