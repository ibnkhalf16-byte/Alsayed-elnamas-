name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform
        run: |
          flutter config --no-analytics
          # إنشاء مجلد android الخاص بالمنصة بالاعتماد على إعدادات Flutter الافتراضية
          flutter create . --platforms=android --org com.elsayed.accounts

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        # سيفشل البناء هنا إذا كان الكود يحتوي على أخطاء برمجية (Errors)
        run: flutter analyze

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Alsayed-Accounts-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
