
name: Diagnose Flutter Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org com.elsayed.accounts

      - name: Install Dependencies
        run: flutter pub get

      - name: Show Flutter Version
        run: |
          echo "===== Flutter Version ====="
          flutter --version

      - name: Diagnose app_links Dependency
        run: |
          echo "===== app_links Dependency Tree ====="
          flutter pub deps --style=tree | grep -B 8 -A 8 "app_links" || true

          echo ""
          echo "===== Resolved app_links ====="
          grep -A 12 -B 3 "app_links:" pubspec.lock || true

      - name: Show Direct Dependencies
        run: |
          echo ""
          echo "===== Direct Dependencies ====="
          flutter pub deps --style=compact

      - name: Stop After Diagnosis
        run: exit 0

