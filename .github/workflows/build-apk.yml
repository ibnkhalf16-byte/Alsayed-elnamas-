name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Platform
        run: |
          flutter config --no-analytics
          rm -rf android
          rm -rf test
          flutter create . --project-name alaa_accounts --platforms=android --org com.elsayed.accounts

      - name: Force App and Plugins to compileSdk 34
        run: |
          # 1. إجبار وحدة التطبيق الأساسية
          sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
          
          # 2. إجبار جميع الإضافات (Plugins) بشكل قاطع عبر afterEvaluate
          cat << 'EOF' >> android/build.gradle
          
          subprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdk = 34
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elsayed-Accounts-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
