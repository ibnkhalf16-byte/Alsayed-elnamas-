name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 2. إعداد Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ==========================================
      # 3. إعداد Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # ==========================================
      # 4. إنشاء Android
      # ==========================================
      - name: Generate Android Platform
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org com.elsayed.accounts

      - name: Inject Biometric Permissions
        run: |
          # إضافة صلاحية البصمة لملف Manifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' android/app/src/main/AndroidManifest.xml
          # تعديل كلاس MainActivity ليدعم مستشعر البصمة
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/com/elsayed/accounts/MainActivity.kt
      # ==========================================
      # 5. إعداد AndroidManifest.xml
      #    - Internet Permission
      #    - اسم التطبيق
      # ==========================================
      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")

          text = path.read_text(encoding="utf-8")

          # ------------------------------------------
          # إزالة أي صلاحية إنترنت مكررة
          # ------------------------------------------
          text = re.sub(
              r'\s*<uses-permission\s+android:name="android\.permission\.INTERNET"\s*/>',
              '',
              text
          )

          # ------------------------------------------
          # إضافة صلاحية الإنترنت بعد إغلاق وسم manifest
          # وليس داخله
          # ------------------------------------------
          manifest_end = text.find(">")

          if manifest_end == -1:
              raise RuntimeError("Could not find opening <manifest> tag.")

          internet_permission = '\n    <uses-permission android:name="android.permission.INTERNET"/>'

          text = (
              text[:manifest_end + 1]
              + internet_permission
              + text[manifest_end + 1:]
          )

          # ------------------------------------------
          # اسم التطبيق
          # ------------------------------------------
          app_name = "حسابات السيد النماس"

          if re.search(r'android:label="[^"]*"', text):
              text = re.sub(
                  r'android:label="[^"]*"',
                  f'android:label="{app_name}"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "<application",
                  f'<application android:label="{app_name}"',
                  1
              )

          path.write_text(text, encoding="utf-8")

          print("==========================================")
          print("AndroidManifest.xml configured successfully")
          print("App Name: حسابات السيد النماس")
          print("Internet Permission: ENABLED")
          print("==========================================")
          PY

      # ==========================================
      # 6. فحص AndroidManifest قبل البناء
      # ==========================================
      - name: Verify Android Manifest
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== Checking XML ====="

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("XML VALID")
          except Exception as e:
              print("XML INVALID")
              print(e)
              raise
          PY

      # ==========================================
      # 7. التأكد من وجود اللوجو
      # ==========================================
      - name: Verify Logo
        run: |
          echo "===== Checking Logo ====="

          if [ -f "assets/images/logo2.png" ]; then
            echo "Logo found successfully:"
            ls -lh assets/images/logo2.png
          else
            echo "ERROR: assets/images/logo2.png was not found!"
            exit 1
          fi

      # ==========================================
      # 8. تثبيت Dependencies
      # ==========================================
      - name: Install Dependencies
        run: |
          flutter pub get

      # ==========================================
      # 9. التحقق من app_links
      # ==========================================
      - name: Verify app_links Version
        run: |
          echo "===== Flutter Version ====="
          flutter --version

          echo ""
          echo "===== Resolved app_links ====="
          grep -A 12 -B 3 "app_links:" pubspec.lock || true

      # ==========================================
      # 10. إنشاء أيقونة التطبيق
      # ==========================================
      - name: Generate App Icons
        run: |
          dart run flutter_launcher_icons

      # ==========================================
      # 11. تحليل المشروع
      # ==========================================
      - name: Analyze Project Code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # ==========================================
      # 12. بناء APK
      # ==========================================
      - name: Build APK Release
        run: |
          flutter build apk --release --no-tree-shake-icons

      # ==========================================
      # 13. رفع APK
      # ==========================================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Alsayed-Accounts-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
