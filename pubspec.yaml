name: alaa_accounts
description: "حسابات علاء ابو شادي - إدارة النقلات والمحاصيل والعمليات المحاسبية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # حزمة الاتصال بقاعدة بيانات Supabase (بديلة لـ SQLite)
  supabase_flutter: ^2.4.0 
  
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  intl: any
  crypto: ^3.0.3
  pdf: ^3.10.8
  # تم تخفيض الإصدار لحل تعارض الحزم مع app_links
  printing: ^5.13.1

# حل مشكلة توقف البناء في GitHub Actions
dependency_overrides:
  app_links: 6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0 # تم إضافتها لحل تحذير analysis_options.yaml

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo2.png
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
