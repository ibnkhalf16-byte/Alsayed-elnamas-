
name: alaa_accounts
description: "حسابات علاء ابو شادي - إدارة النقلات والمحاصيل والعمليات المحاسبية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Supabase - قاعدة البيانات الأساسية للمشروع
  supabase_flutter: ^2.5.6

  # SQLite - يُترك حاليًا للحفاظ على أي وظائف محلية موجودة بالمشروع
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3

  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  intl: any
  crypto: ^3.0.3

  # PDF
  pdf: ^3.10.8
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
    
dependency_overrides:
  app_links: 6.2.1

  # مطلوب بواسطة analysis_options.yaml
  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo2.png

