name: alaa_accounts
description: "حسابات علاء ابو شادي - إدارة النقلات والمحاصيل والعمليات المحاسبية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # تحديث الحزمة لأحدث إصدار متوافق لحل تعارضات التبعيات الداخلية
  supabase_flutter: ^2.8.3
  
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  intl: any
  crypto: ^3.0.3
  pdf: ^3.10.8
  # تحديث مكتبة الطباعة لتتوافق مع Android API 34 بشكل أصلي
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo2.png
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
